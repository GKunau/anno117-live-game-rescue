[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anno117-live-game-rescue"
version = "0.1.0"
description = "Inspect and rescue Anno 117: Pax Romana co-op/live save games (.a8s)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Games/Entertainment :: Real Time Strategy",
]

[project.scripts]
anno117-rescue = "anno117_rescue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
